<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entertainment Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
}

header{
background:black;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
}

header h1{
color:red;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

.hero{
padding:80px 20px;
text-align:center;
background:linear-gradient(to right,#ff0000,#000000);
}

.hero h2{
font-size:45px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
margin-bottom:20px;
}

.hero button{
padding:15px 30px;
font-size:18px;
background:red;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

.section-title{
padding:20px;
font-size:30px;
font-weight:bold;
}

.movies{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.movie-card{
background:#1a1a1a;
border-radius:15px;
overflow:hidden;
transition:0.3s;
}

.movie-card:hover{
transform:scale(1.03);
}

.movie-card img{
width:100%;
height:350px;
object-fit:cover;
}

.movie-info{
padding:15px;
}

.movie-info h3{
margin-bottom:10px;
}

.movie-info p{
font-size:14px;
margin-bottom:10px;
color:#ccc;
}

.buttons{
display:flex;
flex-direction:column;
gap:10px;
}

.watch-btn{
background:red;
}

.download-btn{
background:green;
}

.buttons button{
padding:12px;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.subscription{
background:#181818;
padding:40px 20px;
text-align:center;
}

.subscription h2{
margin-bottom:20px;
font-size:35px;
}

.subscription input,
.subscription select{
width:300px;
padding:15px;
margin:10px;
border:none;
border-radius:10px;
font-size:16px;
}

.subscription button{
padding:15px 30px;
background:red;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.admin-panel{
padding:40px 20px;
background:#101010;
}

.admin-panel h2{
margin-bottom:20px;
}

.admin-panel textarea{
width:100%;
height:150px;
padding:15px;
background:#222;
color:white;
border:none;
border-radius:10px;
margin-bottom:20px;
}

footer{
background:black;
text-align:center;
padding:20px;
margin-top:40px;
}

.video-player{
width:100%;
height:250px;
background:black;
}

@media(max-width:768px){
.hero h2{
font-size:30px;
}

.subscription input,
.subscription select{
width:100%;
}
}
</style>

</head>
<body>

</html>
